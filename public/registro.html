<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | CeroHambre</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="page"><a href="/">Volver al inicio</a><section class="panel"><h1>Crear cuenta</h1><form id="register-form" class="form-grid"><label>Nombre completo<input name="nombre" required maxlength="150"></label><label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Tipo de cuenta<select id="role" name="rol"><option value="donante">Donante</option><option value="organizacion">Organización</option></select></label><div id="organization-fields" hidden><label>Nombre de la organización<input name="nombreOrganizacion"></label><label>Ubicación<input name="ubicacion"></label><label>Documento legal<input name="documentoLegal"></label></div><button type="submit">Registrarme</button></form><p id="message" class="notice" role="status"></p></section></main><script type="module" src="/js/register.js"></script></body></html>
